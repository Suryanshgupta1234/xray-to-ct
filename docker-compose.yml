version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: xray_ct_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-xray_ct_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xray_ct_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xray_network

  # ----------------------------------------------------------------------------
  # Redis Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xray_ct_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xray_network

  # ----------------------------------------------------------------------------
  # FastAPI Backend API & ML Inference Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xray_ct_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-xray_ct_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-xray_ct_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-super_secret_dev_key_change_me_in_production_min_32_characters_12345}
      - LOCAL_STORAGE_PATH=/app/storage
      - MODEL_DIR=/app/models
      - ACTIVE_MODEL_VERSION=v1
      - DEVICE=cpu # set to 'cuda' on GPU-enabled host with nvidia-docker runtime
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xray_network

  # ----------------------------------------------------------------------------
  # React Frontend Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xray_ct_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - xray_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  xray_network:
    driver: bridge
